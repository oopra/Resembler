# Publish the site to GitHub Pages on every push to main.
#
# `enablement: true` matters: it lets this workflow turn Pages ON for the repository the first time
# it runs, rather than failing with a 404 until someone visits Settings and does it by hand. That is
# what happened on the first attempt.
#
# If you would rather use the simpler "Deploy from a branch" Pages setting, this workflow can be
# deleted — but keep the .nojekyll file either way, or Pages pipes the whole repo through Jekyll on
# its way out, and Jekyll has opinions about a directory called vendor/.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # The site IS the repo — no build step, nothing to compile. node_modules is gitignored and
      # tests/ is small, so the whole tree goes up as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
