# Publish the site to GitHub Pages on every push to main.
#
# Only needed if Pages is set to "GitHub Actions" as its source. If you use the simpler
# "Deploy from a branch" setting instead, this workflow is harmless and can be deleted — but keep
# the .nojekyll file either way, or Pages runs the whole repo through Jekyll on its way out.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site IS the repo — no build step, nothing to compile. node_modules is gitignored and
      # tests/ is small, so the whole tree goes up as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
